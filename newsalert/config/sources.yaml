# Every feed / account the system watches.
#
#   name:      unique display name
#   type:      rss | youtube | bluesky | x | wikipedia
#   url:       feed URL (rss / youtube)
#   account:   handle / DID / channel id (social sources)
#   category:  celebrity | anime | manga | tv   (default hint; triage decides per story)
#   trust:     official | major | signal
#                official = the studio / publisher / agency / family / verified rep itself
#                major    = professional newsroom
#                signal   = fast but unverified (Wikipedia edits, fan/aggregator sites)
#   group:     ownership group. Two `major` sources only count as independent
#              confirmation if their groups differ (e.g. Variety + Deadline are both
#              Penske Media, so together they are still SINGLE OUTLET). Defaults to name.
#   interval:  poll interval in seconds (default from settings.yaml)
#   enabled:   false to skip without deleting
#
# These URLs could not be fetched from the build sandbox (its network is locked
# down). Run `newsalert check-sources` on your VM; it reports any URL that fails or
# whose newest item looks oddly old (often a wrong time zone in the feed).

# ---------------- Anime / manga ----------------
- name: Anime News Network
  type: rss
  url: https://www.animenewsnetwork.com/news/rss.xml?ann-edition=w
  category: anime
  trust: major
  group: ann

