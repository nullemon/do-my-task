# ======================================================================
# X accounts (build step 6). Needs a PAID X API tier: set X_BEARER_TOKEN in
# .env, then flip enabled: true on the accounts you want. Without a token
# the X watcher stays idle. Reads count against x.monthly_read_budget.
#   priority: true  -> polled every x.priority_interval (default 5 min)
#   otherwise       -> every x.default_interval (default 30 min)
# Example official accounts; check each handle on x.com before enabling.
# ======================================================================
- name: Crunchyroll (X)
  type: x
  account: Crunchyroll
  category: anime
  trust: official
  group: crunchyroll
  priority: true
  enabled: false

