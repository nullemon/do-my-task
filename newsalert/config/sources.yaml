# ======================================================================
# Wikipedia (build step 7). One source; Wikimedia EventStreams, no keys.
# Watches "Deaths in <Month> <Year>", "Deaths in <Year>" and every
# `wikipedia:` page in watchlist.yaml. Always trust: signal (a hint, never
# a confirmation); reverted edits trigger a "possibly false" follow-up.
# Set a contact address in settings.yaml polling.user_agent first
# (Wikimedia's User-Agent policy).
# ======================================================================
- name: Wikipedia
  type: wikipedia
  category: celebrity
  trust: signal
  group: wikipedia
