[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsalert"
version = "0.1.0"
description = "Local breaking-news alert system for celebrities, anime, manga and TV. Alert only - never publishes."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "feedparser>=6.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
newsalert = "newsalert.cli:main"

[tool.setuptools.packages.find]
include = ["newsalert*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
